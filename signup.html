<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - HerRoute</title>

    <link rel="stylesheet" href="style.css">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="signup-page">

<!-- 🎥 Background Video -->
<video autoplay muted loop class="bg-video">
    <source src="animate.mp4" type="video/mp4">
</video>

<div class="signup-container">

    <!-- LEFT SIDE -->
    <div class="signup-left">

        <div class="logo-section">
            <img src="images/logoo.png" alt="Logo">
            
        </div>

        

    </div>

    <!-- RIGHT SIDE -->
    <div class="signup-right">

        <div class="signup-box">

            <h2>Create Your Account!</h2>
            <p class="subtitle">Join us and start your safe travel journey</p>

            <form>

                <label>Full Name</label>
                <input type="text" placeholder="Enter your full name">

                <label>Email</label>
                <input type="email" placeholder="Enter your email">

                <label>Phone Number</label>
                <input type="text" placeholder="Enter your phone number">

                <label>Password</label>
                <div class="password-field">
                    <input type="password" placeholder="Create a password">
                    <i class="fa-solid fa-eye"></i>
                </div>

                <label>Confirm Password</label>
                <div class="password-field">
                    <input type="password" placeholder="Confirm your password">
                    <i class="fa-solid fa-eye"></i>
                </div>

                <button type="button" onclick="window.location.href='index.html'" class="signup-btn">
                    Sign Up
                </button>

            </form>

            <p class="divider">or continue with</p>

            <div class="social-login">
                <button><i class="fa-brands fa-google"></i> Google</button>
                <button><i class="fa-brands fa-facebook"></i> Facebook</button>
            </div>

            <p class="login-text">
                Already have an account? <a href="login.html">Login</a>
            </p>

        </div>

    </div>

</div>

</body>
</html>
