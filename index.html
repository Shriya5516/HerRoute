<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - HerRoute</title>

    <link rel="stylesheet" href="style.css">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<video autoplay muted loop class="bg-video">
    <source src="animate.mp4" type="video/mp4">
</video>
<body class="login-page">


<div class="login-container">

    <!-- LEFT SIDE -->
    <div class="login-left">

        <div class="logo-section">
            <img src="images/logoo.png" alt="Logo">
        </div>

       

    </div>
    

    <!-- RIGHT SIDE -->
    <div class="login-right">

        <div class="login-box">

            <h2>Welcome Back!</h2>
            <p class="subtitle">Login to continue your journey</p>

            <!-- Form -->
            <form>

                <label>Email or Phone</label>
                <input type="text" placeholder="Enter email or phone">

                <label>Password</label>
                <input type="password" placeholder="Enter password">

                <div class="forgot">
                    <a href="#">Forgot Password?</a>
                </div>

               
                <button type="button" onclick="window.location.href='home.html'" class="login-btn">
    Login
</button>

            </form>

            <!-- Divider -->
            <p class="divider">or continue with</p>

            <!-- Social Login -->
            <div class="social-login">
                <button class="google-btn">
                    <i class="fa-brands fa-google"></i> Google
                </button>

                <button class="facebook-btn">
                    <i class="fa-brands fa-facebook"></i> Facebook
                </button>
            </div>

            <!-- Signup -->
            <p class="signup-text">
                Don’t have an account? <a href="signup.html">Sign up</a>
            </p>

        </div>

    </div>

</div>

</body>
</html>
