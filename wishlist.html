<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saved Trips</title>
    <link rel="stylesheet" href="style.css">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

<!-- Back Arrow -->
<div class="top-bar">
    <a href="profile.html" class="back-arrow">
        <i class="fa-solid fa-arrow-left"></i>
    </a>

    <span class="page-title">Saved Trips</span>
</div>

<!-- Main Section -->
<section class="container">

   
    <!-- Cards -->
    <div class="cards">

        <div class="card">
            <div class="card-img">
                <img src="images/Goa.png">
                <i class="fa-solid fa-heart"></i>
            </div>
            <div class="card-info">
                <h4>Goa</h4>
                <span><i class="fa-solid fa-star"></i> 4.8 (250)</span>
            </div>
        </div>

        <div class="card">
            <div class="card-img">
                <img src="images/ooty.png">
                <i class="fa-solid fa-heart"></i>
            </div>
            <div class="card-info">
                <h4>Ooty</h4>
                <span><i class="fa-solid fa-star"></i> 4.6 (185)</span>
            </div>
        </div>

        <div class="card">
            <div class="card-img">
                <img src="images/kerala.jpg">
                <i class="fa-regular fa-heart"></i>
            </div>
            <div class="card-info">
                <h4>Kerala</h4>
                <span><i class="fa-solid fa-star"></i> 4.6 (164)</span>
            </div>
        </div>

        <div class="card">
            <div class="card-img">
                <img src="images/varanasi.jpg">
                <i class="fa-regular fa-heart"></i>
            </div>
            <div class="card-info">
                <h4>Varanasi</h4>
                <span><i class="fa-solid fa-star"></i> 4.5 (189)</span>
            </div>
        </div>

    </div>

    <!-- Planned Trips -->
    <h3 class="section-title">My Planned Trips</h3>

    <div class="planned-trips">

        <div class="trip">
            <img src="images/Goa.png">
            <div class="trip-info">
                <h4>Goa Trip</h4>
                <p>10 May 2025 - 15 May 2025</p>
            </div>
            <div class="trip-days">5 Days</div>
            <button class="view-btn">View Itinerary</button>
        </div>

        <div class="trip">
            <img src="images/Manali.jpeg">
            <div class="trip-info">
                <h4>Manali Trip</h4>
                <p>20 June 2025 - 24 June 2025</p>
            </div>
            <div class="trip-days">5 Days</div>
            <button class="view-btn">View Itinerary</button>
        </div>

    </div>

</section>

</body>
</html>
